    <text x="606" y="493" fill="#b3c3ca" font-size="16">Muzzle · bolt · exposed edges</text>
    <text x="606" y="521" fill="#b3c3ca" font-size="16">Narrow highlights, restrained shine</text>
    <rect x="862" y="198" width="236" height="225" rx="18" fill="#202c37"/>
    <rect x="913" y="259" width="134" height="82" rx="12" fill="#55c7d9" opacity=".17"/>
    <rect x="936" y="279" width="88" height="42" rx="7" fill="#72d9e7"/>
    <text x="862" y="464" fill="#f3f5f4" font-size="21" font-weight="700">COOL CYAN</text>
    <text x="862" y="493" fill="#b3c3ca" font-size="16">One small receiver indicator</text>
    <text x="862" y="521" fill="#b3c3ca" font-size="16">Accent only, never a glowing body</text>
