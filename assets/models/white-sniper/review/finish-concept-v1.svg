  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="64" y="88" fill="#edf3f4" font-family="Arial,sans-serif" font-weight="700" font-size="35">WHITE SNIPER</text>
  <text x="64" y="126" fill="#a6bbc7" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">FINISH CONCEPT 01 · SNOW FORTRESS</text>
  <rect x="64" y="162" width="1072" height="452" rx="26" fill="#2b3a47" stroke="#536574" filter="url(#shadow)"/>
  <g font-family="Arial,sans-serif">
    <rect x="94" y="198" width="236" height="225" rx="18" fill="url(#enamel)"/>
    <path d="M126 252l160 0M124 307l154 0M145 360l126 0" stroke="#879399" stroke-width="3" opacity=".55"/>
    <text x="94" y="464" fill="#f3f5f4" font-size="21" font-weight="700">OFF-WHITE ENAMEL</text>
    <text x="94" y="493" fill="#b3c3ca" font-size="16">Barrel housing · stock plates</text>
    <text x="94" y="521" fill="#b3c3ca" font-size="16">Soft satin finish, light edge wear</text>
    <rect x="350" y="198" width="236" height="225" rx="18" fill="url(#graphite)"/>
    <path d="M386 214v188M412 214v188M444 214v188M473 214v188M505 214v188M537 214v188" stroke="#687780" stroke-width="2" opacity=".35"/>
    <text x="350" y="464" fill="#f3f5f4" font-size="21" font-weight="700">DARK GRAPHITE</text>
    <text x="350" y="493" fill="#b3c3ca" font-size="16">Grip · rail · scope rings</text>
    <text x="350" y="521" fill="#b3c3ca" font-size="16">Recessed seams for silhouette</text>
    <rect x="606" y="198" width="236" height="225" rx="18" fill="url(#metal)"/>
    <path d="M626 396l180-170M650 410l175-165" stroke="#d2d5d1" stroke-width="2" opacity=".2"/>
