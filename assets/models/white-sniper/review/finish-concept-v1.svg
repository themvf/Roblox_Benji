  <text x="64" y="665" fill="#e3ebee" font-family="Arial,sans-serif" font-size="20">Keep the current rifle silhouette. Concentrate contrast at the scope, grip, receiver and muzzle.</text>
  <text x="64" y="698" fill="#9fb1bd" font-family="Arial,sans-serif" font-size="16">Concept proposal only · No changes to the 3D asset or Roblox Tool yet</text>
