<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#203141"/><stop offset="1" stop-color="#111c27"/></linearGradient>
    <linearGradient id="enamel" x2=".9" y2="1"><stop stop-color="#f2f1e9"/><stop offset="1" stop-color="#b7bdc0"/></linearGradient>
    <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#818b91"/><stop offset=".5" stop-color="#3d494f"/><stop offset="1" stop-color="#9ca5a6"/></linearGradient>
    <linearGradient id="graphite" x2="1" y2="1"><stop stop-color="#3b444a"/><stop offset="1" stop-color="#171e25"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".28"/></filter>
