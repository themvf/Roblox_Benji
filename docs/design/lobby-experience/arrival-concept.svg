  <text x="40" y="68" fill="#a0a5b4" font-family="Arial, sans-serif" font-size="14">Top-down source concept · verify sightlines and queue pads in Studio</text>
  <rect x="138" y="90" width="684" height="395" rx="10" fill="#303540" stroke="#586070" stroke-width="4"/>
  <rect x="181" y="103" width="598" height="209" fill="#252a34" stroke="#ffc446" stroke-width="5"/>
