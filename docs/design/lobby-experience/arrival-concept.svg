  <text x="720" y="237" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">BLUE</text>
  <rect x="427" y="265" width="106" height="32" fill="#4e3660" stroke="#a58bc4"/>
  <text x="480" y="286" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13">PRACTICE</text>
  <rect x="166" y="328" width="175" height="102" fill="#3e4858" stroke="#9fa5b4" stroke-width="3"/>
