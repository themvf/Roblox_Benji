<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Rectangular PLAY hall lobby concept</title>
  <desc id="desc">Source layout concept: arrival spawns face a rectangular PLAY hall containing Duel, Convergence, Team Deathmatch, and Practice. Armory and Alter Ego remain side bays. Not an in-game capture.</desc>
  <rect width="960" height="540" fill="#11141b"/>
