  <text x="480" y="151" text-anchor="middle" fill="#e3e5ed" font-family="Arial, sans-serif" font-size="12">CHOOSE A GAME TYPE · JOIN RED OR BLUE</text>
  <rect x="195" y="169" width="155" height="83" fill="#3b454d" stroke="#78c8a0" stroke-width="2"/>
