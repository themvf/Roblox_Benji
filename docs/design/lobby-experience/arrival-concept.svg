  <text x="480" y="192" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">CONVERGENCE</text>
  <text x="480" y="215" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13">4–6 PER TEAM</text>
  <rect x="610" y="169" width="155" height="83" fill="#414350" stroke="#ffc446" stroke-width="2"/>
  <text x="687" y="190" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">TEAM DEATHMATCH</text>
