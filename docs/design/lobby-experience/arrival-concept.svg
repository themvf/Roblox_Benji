  <text x="706" y="390" text-anchor="middle" fill="#e2c8f5" font-family="Arial, sans-serif" font-size="12">CHOOSE YOUR FORM</text>
  <path d="M427 446 V316 M533 446 V316" stroke="#ffc446" stroke-width="3"/>
  <g fill="#f5f5fa" stroke="#ffc446" stroke-width="3"><circle cx="390" cy="454" r="9"/><circle cx="435" cy="454" r="9"/><circle cx="480" cy="454" r="9"/><circle cx="525" cy="454" r="9"/><circle cx="570" cy="454" r="9"/></g>
